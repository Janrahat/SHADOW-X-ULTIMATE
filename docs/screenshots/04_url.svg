<text x="22" y="1418" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#00ffff" font-weight="700">[i]</tspan><tspan fill="#d7e2ea"> INFO     No strong indicators detected</tspan></text>
<text x="22" y="1437" xml:space="preserve"><tspan fill="#d7e2ea">       </tspan><tspan fill="#808080">The URL shows no significant structural warning signs in this check.</tspan></text>
<text x="22" y="1456" xml:space="preserve"><tspan fill="#d7e2ea">       -&gt; </tspan><tspan fill="#ffff00">Absence of indicators is not proof of safety; stay cautious.</tspan></text>
<text x="22" y="1495" xml:space="preserve"><tspan fill="#ff00ff" font-weight="700">&gt;&gt; Limitations</tspan></text>
<text x="22" y="1514" xml:space="preserve"><tspan fill="#808080">----------------------------------------------------------------------------------------------</tspan></text>
<text x="22" y="1533" xml:space="preserve"><tspan fill="#d7e2ea">  - A URL analysis inspects the link itself; it cannot prove the site&#x27;s intentions.</tspan></text>
<text x="22" y="1552" xml:space="preserve"><tspan fill="#d7e2ea">  - No page content is executed or downloaded beyond the first 4 KB of the response.</tspan></text>
<text x="22" y="1572" xml:space="preserve"><tspan fill="#d7e2ea">  - Reputation lookups require an optional API key and are skipped when unset.</tspan></text>
<text x="22" y="1591" xml:space="preserve"><tspan fill="#d7e2ea">  - Private, loopback and link-local destinations are deliberately refused (SSRF guard).</tspan></text>
