<text x="22" y="189" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#808080">[</tspan><tspan fill="#ffff00" font-weight="700"> 3</tspan><tspan fill="#d7e2ea">)</tspan><tspan fill="#808080">]</tspan><tspan fill="#d7e2ea"> Network diagnostics</tspan></text>
<text x="22" y="208" xml:space="preserve"><tspan fill="#d7e2ea">        </tspan><tspan fill="#808080">latency, TCP, DNS, public IP</tspan></text>
<text x="22" y="228" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#808080">[</tspan><tspan fill="#ffff00" font-weight="700"> 4</tspan><tspan fill="#d7e2ea">)</tspan><tspan fill="#808080">]</tspan><tspan fill="#d7e2ea"> Batch URL scan</tspan></text>
<text x="22" y="247" xml:space="preserve"><tspan fill="#d7e2ea">        </tspan><tspan fill="#808080">score a file of links</tspan></text>
<text x="22" y="266" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#808080">[</tspan><tspan fill="#ffff00" font-weight="700"> 5</tspan><tspan fill="#d7e2ea">)</tspan><tspan fill="#808080">]</tspan><tspan fill="#d7e2ea"> Defensive toolbox</tspan></text>
<text x="22" y="285" xml:space="preserve"><tspan fill="#d7e2ea">        </tspan><tspan fill="#808080">passwords, hashes, JWT, checklist</tspan></text>
<text x="22" y="304" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#808080">[</tspan><tspan fill="#ffff00" font-weight="700"> 6</tspan><tspan fill="#d7e2ea">)</tspan><tspan fill="#808080">]</tspan><tspan fill="#d7e2ea"> Authorized testing</tspan></text>
<text x="22" y="324" xml:space="preserve"><tspan fill="#d7e2ea">        </tspan><tspan fill="#808080">scope-limited service checks</tspan></text>
<text x="22" y="343" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#808080">[</tspan><tspan fill="#ffff00" font-weight="700"> 7</tspan><tspan fill="#d7e2ea">)</tspan><tspan fill="#808080">]</tspan><tspan fill="#d7e2ea"> Share report links</tspan></text>
<text x="22" y="362" xml:space="preserve"><tspan fill="#d7e2ea">        </tspan><tspan fill="#808080">expiring, revocable, consent-based</tspan></text>
<text x="22" y="381" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#808080">[</tspan><tspan fill="#ffff00" font-weight="700"> 8</tspan><tspan fill="#d7e2ea">)</tspan><tspan fill="#808080">]</tspan><tspan fill="#d7e2ea"> Settings</tspan></text>
<text x="22" y="400" xml:space="preserve"><tspan fill="#d7e2ea">        </tspan><tspan fill="#808080">theme, timeouts, limits</tspan></text>
