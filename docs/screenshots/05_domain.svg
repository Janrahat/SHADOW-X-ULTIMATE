<text x="80" y="24" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#7de9ec">SHADOW-X ULTIMATE</text>
<rect x="1761.4" y="8" width="273.6" height="22" rx="5" fill="#0a1218" stroke="#2de2e6" stroke-opacity="0.16"/>
<text x="1770.4" y="23" font-size="11.5" fill="#587a86">$ python3 main.py domain example.com</text>
<text x="22" y="93" xml:space="preserve"><tspan fill="#ff00ff" font-weight="700">&gt;&gt; domain_intelligence :: LOW</tspan></text>
<text x="22" y="112" xml:space="preserve"><tspan fill="#808080">----------------------------------------------------------------------------------------------</tspan></text>
<text x="22" y="132" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">Report ID </tspan><tspan fill="#d7e2ea"> : SX-20261022-100717-96E413</tspan></text>
<text x="22" y="151" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">Target    </tspan><tspan fill="#d7e2ea"> : example.com</tspan></text>
<text x="22" y="170" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">Generated </tspan><tspan fill="#d7e2ea"> : 2026-10-22T10:07:17Z</tspan></text>
<text x="22" y="189" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">Risk score</tspan><tspan fill="#d7e2ea"> : 3/100</tspan></text>
<text x="22" y="208" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">Findings  </tspan><tspan fill="#d7e2ea"> : info=2, low=1</tspan></text>
<text x="22" y="247" xml:space="preserve"><tspan fill="#ff00ff" font-weight="700">&gt;&gt; DNS Records</tspan></text>
<text x="22" y="266" xml:space="preserve"><tspan fill="#808080">----------------------------------------------------------------------------------------------</tspan></text>
<text x="22" y="285" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">A   </tspan><tspan fill="#d7e2ea"> : [&quot;104.20.23.154&quot;, &quot;172.66.147.243&quot;]</tspan></text>
<text x="22" y="304" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">AAAA</tspan><tspan fill="#d7e2ea"> : [&quot;2606:4700:10::6814:179a&quot;, &quot;2606:4700:10::ac42:93f3&quot;]</tspan></text>
<text x="22" y="324" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">MX  </tspan><tspan fill="#d7e2ea"> : [{&quot;preference&quot;: 0, &quot;exchange&quot;: &quot;.&quot;}]</tspan></text>
<text x="22" y="343" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">NS  </tspan><tspan fill="#d7e2ea"> : [&quot;hera.ns.cloudflare.com.&quot;, &quot;elliott.ns.cloudflare.com.&quot;]</tspan></text>
<text x="22" y="362" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">TXT </tspan><tspan fill="#d7e2ea"> : [&quot;v=spf1 -all&quot;, &quot;_k2n1y4vw3qtb4skdx9e7dxt97qrmmq9&quot;]</tspan></text>
<text x="22" y="381" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">SOA </tspan><tspan fill="#d7e2ea"> : [{&quot;mname&quot;: &quot;elliott.ns.cloudflare.com.&quot;, &quot;rname&quot;: &quot;dns.cloudflare.com.&quot;, &quot;serial&quot;: 2418004112, &quot;refresh&quot;: 10000, &quot;retry&quot;: 2400, &quot;expire&quot;: 604800, &quot;minimum&quot;: 1800}]</tspan></text>
<text x="22" y="420" xml:space="preserve"><tspan fill="#ff00ff" font-weight="700">&gt;&gt; Email Authentication (SPF)</tspan></text>
<text x="22" y="439" xml:space="preserve"><tspan fill="#808080">----------------------------------------------------------------------------------------------</tspan></text>
<text x="22" y="458" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">record              </tspan><tspan fill="#d7e2ea"> : v=spf1 -all</tspan></text>
<text x="22" y="477" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">all_qualifier       </tspan><tspan fill="#d7e2ea"> : -</tspan></text>
<text x="22" y="496" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">dns_lookups_estimate</tspan><tspan fill="#d7e2ea"> : 0</tspan></text>
<text x="22" y="535" xml:space="preserve"><tspan fill="#ff00ff" font-weight="700">&gt;&gt; Email Authentication (DMARC)</tspan></text>
<text x="22" y="554" xml:space="preserve"><tspan fill="#808080">----------------------------------------------------------------------------------------------</tspan></text>
<text x="22" y="573" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">record          </tspan><tspan fill="#d7e2ea"> : v=DMARC1;p=reject;sp=reject;adkim=s;aspf=s</tspan></text>
<text x="22" y="592" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">policy          </tspan><tspan fill="#d7e2ea"> : reject</tspan></text>
<text x="22" y="612" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">pct             </tspan><tspan fill="#d7e2ea"> : 100</tspan></text>
<text x="22" y="631" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">rua             </tspan><tspan fill="#d7e2ea"> : None</tspan></text>
<text x="22" y="650" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">subdomain_policy</tspan><tspan fill="#d7e2ea"> : reject</tspan></text>
<text x="22" y="669" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">ruf             </tspan><tspan fill="#d7e2ea"> : None</tspan></text>
<text x="22" y="708" xml:space="preserve"><tspan fill="#ff00ff" font-weight="700">&gt;&gt; Email Authentication (DMARC)</tspan></text>
<text x="22" y="727" xml:space="preserve"><tspan fill="#808080">----------------------------------------------------------------------------------------------</tspan></text>
<text x="22" y="746" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#00ff00" font-weight="700">[+]</tspan><tspan fill="#d7e2ea"> LOW      DMARC has no aggregate report address</tspan></text>
<text x="22" y="765" xml:space="preserve"><tspan fill="#d7e2ea">       </tspan><tspan fill="#808080">Without rua you will not see who is sending as your domain.</tspan></text>
<text x="22" y="784" xml:space="preserve"><tspan fill="#d7e2ea">       -&gt; </tspan><tspan fill="#ffff00">Add rua=mailto:dmarc@yourdomain.</tspan></text>
<text x="22" y="823" xml:space="preserve"><tspan fill="#ff00ff" font-weight="700">&gt;&gt; WHOIS</tspan></text>
<text x="22" y="842" xml:space="preserve"><tspan fill="#808080">----------------------------------------------------------------------------------------------</tspan></text>
<text x="22" y="861" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">registrar        </tspan><tspan fill="#d7e2ea"> : RESERVED-Internet Assigned Numbers Authority</tspan></text>
<text x="22" y="880" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">created          </tspan><tspan fill="#d7e2ea"> : 1995-08-14T04:00:00Z</tspan></text>
<text x="22" y="900" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">updated          </tspan><tspan fill="#d7e2ea"> : 2026-08-14T08:01:43Z</tspan></text>
<text x="22" y="919" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">expires          </tspan><tspan fill="#d7e2ea"> : 2027-08-13T04:00:00Z</tspan></text>
<text x="22" y="938" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">status           </tspan><tspan fill="#d7e2ea"> : [&quot;clientDeleteProhibited https://icann.org/epp#clientDeleteProhibited&quot;, &quot;clientTransferProhibited https://icann.org/epp#clientTransferProhibited&quot;, &quot;clientUpdateProhibited https://icann.org/epp#clientUpdateProhibited&quot;]</tspan></text>
<text x="22" y="957" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">nameservers      </tspan><tspan fill="#d7e2ea"> : [&quot;ELLIOTT.NS.CLOUDFLARE.COM&quot;, &quot;HERA.NS.CLOUDFLARE.COM&quot;]</tspan></text>
<text x="22" y="976" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">dnssec           </tspan><tspan fill="#d7e2ea"> : signedDelegation</tspan></text>
<text x="22" y="996" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">server           </tspan><tspan fill="#d7e2ea"> : whois.verisign-grs.com</tspan></text>
<text x="22" y="1015" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">raw_length       </tspan><tspan fill="#d7e2ea"> : 3325</tspan></text>
<text x="22" y="1034" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">days_until_expiry</tspan><tspan fill="#d7e2ea"> : 294</tspan></text>
<text x="22" y="1072" xml:space="preserve"><tspan fill="#ff00ff" font-weight="700">&gt;&gt; RDAP</tspan></text>
<text x="22" y="1092" xml:space="preserve"><tspan fill="#808080">----------------------------------------------------------------------------------------------</tspan></text>
<text x="22" y="1111" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#00ffff" font-weight="700">[i]</tspan><tspan fill="#d7e2ea"> INFO     RDAP lookup failed</tspan></text>
<text x="22" y="1130" xml:space="preserve"><tspan fill="#d7e2ea">       </tspan><tspan fill="#808080">HTTP 302</tspan></text>
<text x="22" y="1149" xml:space="preserve"><tspan fill="#d7e2ea">       -&gt; </tspan><tspan fill="#ffff00">No action needed; WHOIS results remain authoritative where present.</tspan></text>
<text x="22" y="1188" xml:space="preserve"><tspan fill="#ff00ff" font-weight="700">&gt;&gt; TLS Certificate</tspan></text>
<text x="22" y="1207" xml:space="preserve"><tspan fill="#808080">----------------------------------------------------------------------------------------------</tspan></text>
<text x="22" y="1226" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">error         </tspan><tspan fill="#d7e2ea"> : None</tspan></text>
<text x="22" y="1245" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">subject       </tspan><tspan fill="#d7e2ea"> : {&quot;commonName&quot;: &quot;example.com&quot;}</tspan></text>
<text x="22" y="1264" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">issuer        </tspan><tspan fill="#d7e2ea"> : {&quot;countryName&quot;: &quot;US&quot;, &quot;organizationName&quot;: &quot;SSL Corporation&quot;, &quot;commonName&quot;: &quot;Cloudflare TLS Issuing ECC CA 3&quot;}</tspan></text>
<text x="22" y="1284" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">not_before    </tspan><tspan fill="#d7e2ea"> : Sep 26 22:49:11 2026 GMT</tspan></text>
<text x="22" y="1303" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">not_after     </tspan><tspan fill="#d7e2ea"> : Dec 25 22:56:35 2026 GMT</tspan></text>
<text x="22" y="1322" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">days_remaining</tspan><tspan fill="#d7e2ea"> : 64</tspan></text>
<text x="22" y="1341" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">san           </tspan><tspan fill="#d7e2ea"> : [&quot;example.com&quot;, &quot;*.example.com&quot;]</tspan></text>
<text x="22" y="1360" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">san_count     </tspan><tspan fill="#d7e2ea"> : 2</tspan></text>
<text x="22" y="1380" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">protocol      </tspan><tspan fill="#d7e2ea"> : TLSv1.3</tspan></text>
<text x="22" y="1399" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">cipher        </tspan><tspan fill="#d7e2ea"> : TLS_AES_256_GCM_SHA384</tspan></text>
<text x="22" y="1418" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">expired       </tspan><tspan fill="#d7e2ea"> : False</tspan></text>
<text x="22" y="1456" xml:space="preserve"><tspan fill="#ff00ff" font-weight="700">&gt;&gt; Reputation Indicators</tspan></text>
<text x="22" y="1476" xml:space="preserve"><tspan fill="#808080">----------------------------------------------------------------------------------------------</tspan></text>
<text x="22" y="1495" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">registered_domain</tspan><tspan fill="#d7e2ea"> : example.com</tspan></text>
<text x="22" y="1514" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#ff00ff">notes            </tspan><tspan fill="#d7e2ea"> : heuristic only - no blocklist or reputation API was queried</tspan></text>
<text x="22" y="1552" xml:space="preserve"><tspan fill="#ff00ff" font-weight="700">&gt;&gt; Reputation Indicators</tspan></text>
<text x="22" y="1572" xml:space="preserve"><tspan fill="#808080">----------------------------------------------------------------------------------------------</tspan></text>
<text x="22" y="1591" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#00ffff" font-weight="700">[i]</tspan><tspan fill="#d7e2ea"> INFO     No heuristic red flags</tspan></text>
<text x="22" y="1610" xml:space="preserve"><tspan fill="#d7e2ea">       </tspan><tspan fill="#808080">No suspicious naming patterns were detected.</tspan></text>
<text x="22" y="1629" xml:space="preserve"><tspan fill="#d7e2ea">       -&gt; </tspan><tspan fill="#ffff00">Absence of heuristics is not a reputation guarantee.</tspan></text>
<text x="22" y="1668" xml:space="preserve"><tspan fill="#ff00ff" font-weight="700">&gt;&gt; Limitations</tspan></text>
<text x="22" y="1687" xml:space="preserve"><tspan fill="#808080">----------------------------------------------------------------------------------------------</tspan></text>
<text x="22" y="1706" xml:space="preserve"><tspan fill="#d7e2ea">  - WHOIS and RDAP data is self-reported by registrars and can be redacted.</tspan></text>
<text x="22" y="1725" xml:space="preserve"><tspan fill="#d7e2ea">  - Reputation indicators here are heuristic; no third-party blocklist is queried by default.</tspan></text>
<text x="22" y="1744" xml:space="preserve"><tspan fill="#d7e2ea">  - DNS answers may be geo-steered or CDN-specific and differ from other vantage points.</tspan></text>
</svg>