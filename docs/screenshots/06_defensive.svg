<text x="22" y="112" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#808080">[</tspan><tspan fill="#ffff00" font-weight="700"> 1</tspan><tspan fill="#d7e2ea">)</tspan><tspan fill="#808080">]</tspan><tspan fill="#d7e2ea"> Password generator</tspan></text>
<text x="22" y="132" xml:space="preserve"><tspan fill="#d7e2ea">        </tspan><tspan fill="#808080">cryptographically secure</tspan></text>
<text x="22" y="151" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#808080">[</tspan><tspan fill="#ffff00" font-weight="700"> 2</tspan><tspan fill="#d7e2ea">)</tspan><tspan fill="#808080">]</tspan><tspan fill="#d7e2ea"> Password strength</tspan></text>
<text x="22" y="170" xml:space="preserve"><tspan fill="#d7e2ea">        </tspan><tspan fill="#808080">entropy, crack time, weak patterns</tspan></text>
<text x="22" y="189" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#808080">[</tspan><tspan fill="#ffff00" font-weight="700"> 3</tspan><tspan fill="#d7e2ea">)</tspan><tspan fill="#808080">]</tspan><tspan fill="#d7e2ea"> Hash text or file</tspan></text>
<text x="22" y="208" xml:space="preserve"><tspan fill="#d7e2ea">        </tspan><tspan fill="#808080">SHA-256 and others</tspan></text>
<text x="22" y="228" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#808080">[</tspan><tspan fill="#ffff00" font-weight="700"> 4</tspan><tspan fill="#d7e2ea">)</tspan><tspan fill="#808080">]</tspan><tspan fill="#d7e2ea"> File integrity check</tspan></text>
<text x="22" y="247" xml:space="preserve"><tspan fill="#d7e2ea">        </tspan><tspan fill="#808080">compare a known digest</tspan></text>
<text x="22" y="266" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#808080">[</tspan><tspan fill="#ffff00" font-weight="700"> 5</tspan><tspan fill="#d7e2ea">)</tspan><tspan fill="#808080">]</tspan><tspan fill="#d7e2ea"> Base64 / URL encode &amp; decode</tspan></text>
<text x="22" y="285" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#808080">[</tspan><tspan fill="#ffff00" font-weight="700"> 6</tspan><tspan fill="#d7e2ea">)</tspan><tspan fill="#808080">]</tspan><tspan fill="#d7e2ea"> JSON validator</tspan></text>
<text x="22" y="304" xml:space="preserve"><tspan fill="#d7e2ea">        </tspan><tspan fill="#808080">parse and pretty-print</tspan></text>
