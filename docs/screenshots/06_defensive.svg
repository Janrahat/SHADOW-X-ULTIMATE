<text x="22" y="343" xml:space="preserve"><tspan fill="#d7e2ea">        </tspan><tspan fill="#808080">structure only, no signature guessing</tspan></text>
<text x="22" y="362" xml:space="preserve"><tspan fill="#d7e2ea">  </tspan><tspan fill="#808080">[</tspan><tspan fill="#ffff00" font-weight="700"> 8</tspan><tspan fill="#d7e2ea">)</tspan><tspan fill="#808080">]</tspan><tspan fill="#d7e2ea"> Security checklist</tspan></text>
